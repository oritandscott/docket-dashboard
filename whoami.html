<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Computer</title>
<style>
  :root{ --paper:#0B0B0C; --ink:#ECECEC; --soft:#9A9A9E; --gold:#C9A15D; }
  body{ margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px 16px; }
  #name{ font-size:2rem; font-weight:700; color:var(--gold); }
  p{ color:var(--soft); font-size:.85rem; max-width:560px; }
</style>
</head>
<body>
<div>This Chrome is:</div>
<div id="name">…</div>
<p>Scheduled tasks open this page in each connected Chrome to find the right computer.
To label this Chrome, open this page once with <code>?set=OASIS MINI</code> (or another name) at the end of the address.</p>
<script>
  // Per-browser label kept in this Chrome's own storage.
  let name = '';
  try {
    const set = new URLSearchParams(location.search).get('set');
    if (set) { localStorage.setItem('docket-computer', set.trim().slice(0, 40)); history.replaceState(null, '', location.pathname); }
    name = localStorage.getItem('docket-computer') || '';
  } catch (e) {}
  document.getElementById('name').textContent = name || 'NOT LABELED';
  document.title = name ? `Computer: ${name}` : 'Computer: not labeled';
</script>
</body>
</html>
